 return `<section class="ui-view" data-view="history">${uiHead('轮回','道痕留在神魂中，每一世都能继续前行。')}
 <article class="ui-panel ui-soul-panel"><div><span class="ui-kicker">可分配道痕</span><div class="ui-mark-count">${money(state.daoMarks)}</div><p>由你亲自分配，未使用的道痕会保留。</p></div><span class="ui-watermark">☯</span></article>
 <article class="ui-panel"><div class="ui-section-title">神魂潜力 <small>手动分配</small></div><div class="ui-potential-grid">${potentialTypes.map(x=>`<div class="ui-potential"><span>${x.glyph} ${x.name}</span><strong>${statLevel(x.key)}</strong><small>${x.desc}</small><button class="ui-button" data-action="allocate-potential" data-key="${x.key}" ${state.daoMarks<=0?'disabled':''}>＋ 提升</button></div>`).join('')}</div><p class="ui-muted">四项潜力随同一神魂跨世积累。</p></article>
 <details class="ui-detail" data-detail="milestones"><summary>历世大事 <span>${state.milestones.length} 件</span></summary><div class="ui-detail-body ui-yearbook">${state.milestones.length?state.milestones.slice().reverse().map(x=>`<div class="ui-event ${x.kind==='red'?'ui-danger':''}"><span>第${x.generation}世<br>${x.age}岁</span><p>${esc(x.text)}</p></div>`).join(''):'<p class="ui-muted">重要的突破与机缘会留在这里。</p>'}</div></details>
 <details class="ui-detail" data-detail="archive"><summary>前世记录 <span>${state.archive.length} 世</span></summary><div class="ui-detail-body">${state.archive.length?state.archive.slice().reverse().slice(0,30).map(r=>`<div class="ui-simple-row"><span>第 ${r.generation} 世 · ${esc(r.realm)}</span><small>${r.age} 岁 · ${esc(r.cause)} · +${r.marks} 道痕</small></div>`).join(''):'<p class="ui-muted">尚未经历轮回。</p>'}</div></details>
 <details class="ui-detail" data-detail="manage"><summary>存档管理 <span>导入 / 导出 / 重启</span></summary><div class="ui-detail-body ui-actions"><button class="ui-button" data-action="export-save">导出存档</button><button class="ui-button" data-action="import-save">导入存档</button><button class="ui-button" data-action="reset">重启游戏</button></div></details>
 </section>`;
}

const PILL_HEAL=[8,20,45,100,230,500];
function recordYear(text,kind='normal'){
 state.yearbook.unshift({age:state.age,text,kind});
 if(state.yearbook.length>300)state.yearbook.length=300;
}
function rememberMilestone(text,kind='gold'){
 state.milestones.push({generation:state.generation,age:state.age,text,kind});
}
function receivePill(grade,source){
 state.pills[grade]=Math.min(99,state.pills[grade]+1);
 const name=`${P.GRADES[grade].name}回春丹`;
 if(grade>=4)rememberMilestone(`${source}得到${name}`);
 return `${source}得到${name}。`;
}
function healAutomatically(){
 if(state.injuryYears<=0)return '';
 const enough=state.pills.findIndex((count,i)=>count>0&&PILL_HEAL[i]>=state.injuryYears);
 let grade=enough;
 if(grade<0)for(let i=5;i>=0;i--)if(state.pills[i]>0){grade=i;break}
 if(grade<0)return '';
 state.pills[grade]--;
 const restored=P.heal(state,PILL_HEAL[grade]);
 return `自动服用${P.GRADES[grade].name}回春丹，恢复${restored}年寿元。`;
}
function rollYearlyEvent(){
 const fortune=Math.max(0,statLevel('fortune'));
 const roll=rng()-Math.min(.16,fortune*.006);
 const marketChance=Math.min(.035,.012+fortune*.0008);
 const pillChance=Math.min(.14,.075+fortune*.002);
 const gearChance=Math.min(.09,.04+fortune*.0015);
 const insightChance=Math.min(.18,.11+fortune*.002);
 const battleChance=.055;
 if(roll<marketChance){
  const rareRoll=rng()+Math.min(.2,fortune*.008);
  const grade=rareRoll>.96?5:rareRoll>.72?4:3;
  return {text:receivePill(grade,'坊市巧遇丹师，'),kind:'fortune'};
 }
 if(roll<marketChance+pillChance){
  const grade=Math.min(3,Math.floor(rng()*3+Math.min(1.5,state.realm*.12+fortune*.015)));
  return {text:receivePill(grade,'外出历练，'),kind:'fortune'};
 }
 if(roll<marketChance+pillChance+gearChance){
  const found=resolveGear(),gear=found.item;
  if(!found.upgraded)return {text:`山野历练，发现${gear.name}，灵蕴不及随身法宝，未留存。`,kind:'normal'};
  if(gear.rarity>=4)rememberMilestone(`历练得到${gear.name}（${P.GRADES[gear.rarity].name}）`);
  return {text:`山野历练，发现${gear.name}（${P.GRADES[gear.rarity].name}），已自动佩戴${found.replaced?'并替换旧法宝':''}。`,kind:'fortune'};
 }
 if(roll<marketChance+pillChance+gearChance+insightChance){
  const gain=Math.min(12,P.annualProgress(state,totalPower())*(.6+rng()*1.2)*(1+Math.min(.3,fortune*.015)));
  if(state.realm>0&&state.realm<10&&state.minor===9&&state.realmExp>=100){
   const wisdom=statLevel('wisdom');state.bottleneck=Math.min(100,state.bottleneck+gain*(4+Math.min(30,wisdom)*.16));
   return {text:`修行有悟，大境界瓶颈松动。`,kind:'fortune'};
  }
  state.realmExp=Math.min(100,state.realmExp+gain);
  return {text:`修行有悟，额外积蓄${gain<1?gain.toFixed(2):gain.toFixed(1)}%修为。`,kind:'fortune'};
 }
 if(roll>1-battleChance){
  const enemy=Math.round((10+state.realm*10+state.minor*2)*(.7+rng()*.75));
  const strike=Math.round(combatValue()*(.78+rng()*.5+Math.min(.25,fortune*.006)));
  if(strike>=enemy){
   const grade=Math.min(5,Math.floor(rng()*3+state.realm*.22+fortune*.025));
   return {text:`历练遭遇妖兽，以攻击${attackValue()}、战力${combatValue()}取胜。${receivePill(grade,'战后，')}`,kind:'fortune'};
  }
  const injury=P.injure(state,Math.max(2,Math.round(state.naturalMaxLife*(.006+Math.min(.02,enemy/Math.max(1,strike)*.008)))));
  if(injury>0){if(injury>=20)rememberMilestone(`历练战败，折损${injury}年寿元`,'red');return {text:`历练遭遇妖兽，战力${combatValue()}不敌，受伤折寿${injury}年。`,kind:'danger'}}
  return {text:'历练遇到妖兽，勉强脱身。',kind:'normal'};
 }
 return {text:'',kind:'normal'};
}

function render(){
 const opened=new Set(app.querySelectorAll?[...app.querySelectorAll('details[open][data-detail]')].map(x=>x.dataset.detail):[]);
 const tabs={life:simpleLifeView,history:simpleHistoryView};
 if(!tabs[state.activeTab])state.activeTab='life';
 const entries=[['life','☯','修行'],['history','☷','轮回']];
 app.innerHTML=`<header class="ui-top"><button class="ui-brand" data-tab="life"><span class="ui-brand-mark">☯</span><strong>万世仙途</strong></button><div class="ui-top-status">第 ${state.generation} 世 · <b>${realmName()}</b></div><div class="ui-top-controls">${[1,4,12].map(s=>`<button data-action="speed" data-speed="${s}" class="${state.speed===s?'active':''}">${s}×</button>`).join('')}<button data-action="pause" aria-label="${state.paused?'继续':'暂停'}">${state.paused?'▶':'Ⅱ'}</button></div><input class="save-file-input" id="save-file" type="file" accept=".json,application/json"></header><div class="ui-shell"><nav class="ui-nav" aria-label="游戏页面">${entries.map(([key,glyph,label])=>`<button data-tab="${key}" class="${state.activeTab===key?'active':''}"><span>${glyph}</span>${label}</button>`).join('')}</nav><main class="ui-content">${tabs[state.activeTab]()}</main></div>`;
 if(app.querySelectorAll)for(const detail of app.querySelectorAll('details[data-detail]'))if(opened.has(detail.dataset.detail))detail.open=true;
}
function makeGear(slot,forceRarity){const pool=gearNames[slot],max=pool.length-1;let rarity=forceRarity??Math.min(max,Math.floor(rng()*6+statLevel('fortune')*.13));const pick=Math.min(max,rarity);return{id:`g${Date.now().toString(36)}${Math.floor(rng()*1e5).toString(36)}`,slot,name:pool[pick],rarity,power:1+pick*3+Math.floor(rng()*3),desc:['寻常法器，尚有温养余地。','灵机流转，贴合修行之用。','器有灵性，内蕴一缕道韵。','古法炼制，灵辉已成。','天地奇珍，足以守护数世。','天地初开时遗落的道器。'][pick]}}
function resolveGear(){const slot=['weapon','armor','charm'][Math.floor(rng()*3)],item=makeGear(slot),old=state.gear.find(g=>g.slot===slot);if(old&&!strongerGear(item,old))return{item,upgraded:false};state.gear=state.gear.filter(g=>g.slot!==slot);state.gear.push(item);state.equipped[slot]=item.id;return{item,upgraded:true,replaced:old?.name||''}}
function tick(){
 if(state.paused)return;
 for(let y=0;y<state.speed;y++){
  state.age++;state.yearTotal++;
  if(state.age>=state.maxLife){recordYear('寿元走到尽头，神魂转入下一世。','death');die('寿元已尽，寿终坐化');break}
  const notes=[];
  const encounter=rollYearlyEvent();if(encounter.text)notes.push(encounter.text);
  const annual=P.annualProgress(state,totalPower());
  const progress=annual<1?annual.toFixed(2):annual.toFixed(1);
  const outcome=P.advance(state,rng,totalPower());
  let headline=`闭关修炼，修为推进${progress}%。`,kind=encounter.kind;
  if(outcome.kind==='minor'){headline=`修为渐深，踏入${realmName()}第${state.minor}层。`;kind='breakthrough'}
  if(outcome.kind==='bottleneck')headline=`修为已满，正在化解${realmName()}境瓶颈（${Math.floor(state.bottleneck)}%）。`;
  if(outcome.kind==='realm'){headline=`破境成功，踏入${realmName()}，寿元随之增长。`;kind='breakthrough';rememberMilestone(`踏入${realmName()}境`)}
  if(outcome.kind==='setback'){headline=`瓶颈反噬，冲关失利，伤势折寿${outcome.injury}年。`;kind='danger';if(outcome.injury>=20)rememberMilestone(`冲关失利，折损${outcome.injury}年寿元`,'red')}
  if(state.age%13===0&&rng()<.32){const found=P.discoverMethod(state,rng);if(found){notes.push(`领悟${found.name}（${P.GRADES[found.grade].name}）。`);if(found.grade>=4)rememberMilestone(`习得${found.name}（${P.GRADES[found.grade].name}）`)}}
  if(state.realm>=4&&state.age%19===0&&rng()>(.88+Math.min(.1,statLevel('fortune')*.004))){
   const hurt=P.injure(state,Math.round(state.naturalMaxLife*.025));if(hurt>0){notes.push(`天劫擦身，伤势折寿${hurt}年。`);kind='danger';if(hurt>=20)rememberMilestone(`天劫重伤，折损${hurt}年寿元`,'red')}
  }
  const healed=healAutomatically();if(healed)notes.push(healed);
  recordYear([headline,...notes].join(' '),kind);
  if(state.age>=state.maxLife){die('伤势侵蚀寿元，坐化');break}
 }
 saveAndRender();
}
function die(cause){
 const bonusMarks=1+Math.floor(state.age/20)+Math.floor(state.realm/2);
 const rec={generation:state.generation,name:state.name,age:state.age,realm:realmName(),cause,marks:bonusMarks,path:state.path};
 state.archive.push(rec);state.daoMarks+=bonusMarks;rememberMilestone(`${cause}，得${bonusMarks}点道痕`,'red');
 state.generation++;state.age=0;state.realm=0;state.realmExp=0;state.bottleneck=0;state.yearbook=[];
 state.path=paths[Math.floor(rng()*paths.length)];state.name='无名';
 Object.assign(state,P.newLifeFields(state.potential,rng));state.started=true;state.paused=false;P.syncLife(state);
 save();render();
}
function allocatePotential(key){
 if(!potentialTypes.some(x=>x.key===key)||state.daoMarks<=0)return;
 state.daoMarks--;state.potential[key]++;P.syncLife(state);saveAndRender();
}
function action(name,el){
 switch(name){
  case'pause':state.paused=!state.paused;saveAndRender();break;
  case'speed':if([1,4,12].includes(Number(el.dataset.speed)))state.speed=Number(el.dataset.speed);saveAndRender();break;
  case'allocate-potential':allocatePotential(el.dataset.key);break;
  case'reset':if(confirm('确定清除本机存档，从第一世重新开始吗？此操作无法撤回。')){localStorage.removeItem(SAVE_KEY);state=fresh();Object.assign(state,P.newLifeFields(state.potential,rng));state.started=true;P.syncLife(state);saveAndRender()}break;
 }
}
function bind(){app.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav&&!nav.dataset.action){state.activeTab=nav.dataset.tab;saveAndRender();return}const btn=e.target.closest('[data-action]');if(btn){e.preventDefault();if(btn.dataset.action==='toggle-transfer'){const panel=document.getElementById('transfer-panel');if(panel)panel.hidden=!panel.hidden;return}if(btn.dataset.action==='export-save'){exportSave();return}if(btn.dataset.action==='import-save'){document.getElementById('save-file')?.click();return}action(btn.dataset.action,btn);return}const navb=e.target.closest('.nav-btn');if(navb){state.activeTab=navb.dataset.tab;saveAndRender()}});app.addEventListener('change',e=>{if(e.target?.id==='save-file'&&e.target.files?.[0]){importSaveFile(e.target.files[0]);e.target.value=''}})}
function init(){
 if(!state.generation)state=fresh();
 if(!state.started){Object.assign(state,P.newLifeFields(state.potential,rng));state.started=true;state.paused=false}
 P.syncLife(state);
 if(state.age>=state.maxLife)die('寿元已尽，寿终坐化');
 bind();render();interval=setInterval(tick,3000);
 setInterval(()=>{if(!state.paused)save()},10000);window.addEventListener('beforeunload',save);
}
init();
})();

</script>
</body>
</html>
