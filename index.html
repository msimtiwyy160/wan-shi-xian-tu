function makeGear(slot,forceRarity){const pool=gearNames[slot],max=pool.length-1;let rarity=forceRarity??Math.min(max,Math.floor(rng()*6+statLevel('fortune')*.13));const pick=Math.min(max,rarity);return{id:`g${Date.now().toString(36)}${Math.floor(rng()*1e5).toString(36)}`,slot,name:pool[pick],rarity,power:1+pick*3+Math.floor(rng()*3),desc:['寻常法器，尚有温养余地。','灵机流转，贴合修行之用。','器有灵性，内蕴一缕道韵。','古法炼制，灵辉已成。','天地奇珍，足以守护数世。','天地初开时遗落的道器。'][pick]}}

function tick(){
 if(state.paused||state.pending)return;
 for(let y=0;y<state.speed;y++){
  if(state.pending)break;
  state.age++;state.yearTotal++;
  if(state.age>=state.maxLife){die('寿元已尽，寿终坐化');break}
  if(state.cave.autoCultivate){state.stones+=state.cave.level*2;if(state.stones>=state.cave.level*45&&state.cave.level<10){state.stones-=state.cave.level*45;state.cave.level++;log(`家族积累充盈，洞府自然扩建至第 <b>${state.cave.level}</b> 重。`,'gold')}}
  if(state.cave.autoBuy&&state.stones>3)state.stones--;
  if(state.partner){state.partner.affinity=Math.min(100,state.partner.affinity+(rng()<.18?1:0));if(state.age%9===0&&state.descendants<9&&rng()<.44){state.descendants++;state.familyProsperity++;const grade=Math.min(5,Math.floor((statLevel('root')+Math.floor(rng()*8))/8));state.children.push({name:`${state.partner.name.slice(0,1)}氏后人·${state.descendants}`,grade,element:P.ELEMENTS[Math.floor(rng()*5)]});log(`道侣与家族迎来新生，第 <b>${state.descendants}</b> 位子嗣降生。`,'gold')}}
  const outcome=P.advance(state,rng,totalPower());
  if(outcome.kind==='minor')log(`修为渐深，踏入 <b>${realmName()}第 ${state.minor} 层</b>。`,'gold');
  if(outcome.kind==='realm'){log(`灵台豁然开朗，成功踏入 <b>${realmName()}</b>，寿元随境界增长。`,'gold');state.stones+=7+state.realm*2;if(state.realm===10)toast('你已证得真仙，但轮回仍可继续。')}
  if(outcome.kind==='setback')log(`冲关失利，气血受损，伤势折寿 <b>${outcome.injury}</b> 年。可去坊市购回春丹。`,'red');
  if(state.age>=state.maxLife){die('伤势侵蚀寿元，坐化');break}
  if(state.age%13===0&&rng()<.32){const found=P.discoverMethod(state,rng);if(found)log(`偶得玉简，习得 <b>${found.name}</b>（${P.GRADES[found.grade].name}）。`,'gold')}
  if(state.age>=18&&state.age<Math.min(160,state.maxLife-8)&&!state.partner&&state.age%8===2&&rng()<(.18+statLevel('fortune')*.012)){const candidate=pickCandidate();state.pending={kind:'partner',candidates:[candidate]};state.paused=true;log('山道转角，遇见一位气息相投的修士。','gold');break}
  if(state.age>=12&&state.age%23===4&&rng()<.28){const slot=['weapon','armor','charm'][Math.floor(rng()*3)],item=makeGear(slot,2+Math.floor(rng()*Math.min(3,1+statLevel('fortune')/4))),price=24+item.power*5;state.pending={kind:'merchant',item,price};state.paused=true;log('云游商人来到洞府山门，带来一件稀有法器。','gold');break}
  if(state.age%Math.max(4,12-Math.floor(statLevel('fortune')/3))===0&&rng()<.48)resolveGear();
  if(state.age%14===0)log('闭关数载，道心沉静，修为稳步积攒。');
  if(state.age%5===0)state.spirit+=1+Math.floor(statLevel('root')/3)+state.cave.level;
  if(state.realm>=4&&state.age%19===0&&rng()>(.8+statLevel('vitality')*.012+statLevel('wisdom')*.006)){const hurt=P.injure(state,Math.round(state.naturalMaxLife*.025));log(`天劫擦身而过，伤势折寿 <b>${hurt}</b> 年。`,'red');if(state.age>=state.maxLife){die('天劫重伤，寿元耗尽');break}}
  if(state.stones>5000)state.stones=5000;
 }
 saveAndRender();
}
function pickCandidate(){const chanceOld=Math.min(.55,state.companionFates.filter(x=>!x.reunited).length*.18+(state.companionFates.length?statLevel('fortune')*.012:0));if(state.companionFates.length&&rng()<chanceOld){const old=state.companionFates.find(x=>!x.reunited);if(old){old.reunited=true;state.reunionText=`前世相伴之人「${old.name}」带着新的身份再次出现。也许是因缘未尽，也许只是相似的魂光。`;return{name:old.name,title:old.title,glyph:old.glyph,trait:`前缘再续，缘深道痕相应`,accent:old.accent,old:true}}}return{...companionPool[Math.floor(rng()*companionPool.length)],old:false}}
function die(cause){if(state.pending)return;const bonusMarks=1+Math.floor(state.age/20)+Math.floor(state.realm/2)+(state.partner?1:0)+(state.descendants>=2?1:0);const rec={generation:state.generation,name:state.name,age:state.age,realm:realmName(),cause,marks:bonusMarks,path:state.path,partner:state.partner?.name||'',descendants:state.descendants};state.archive.push(rec);if(state.archive.length>100)state.archive.shift();state.daoMarks+=bonusMarks;if(state.partner){state.companionFates.push({...state.partner,generation:state.generation,reunited:false});if(state.companionFates.length>20)state.companionFates.shift()}state.familyProsperity+=state.descendants+Math.floor(state.cave.level/2);if(state.gear.length){const legacy=state.gear.slice().sort((a,b)=>b.rarity-a.rarity)[0];if(legacy.rarity>=1&&state.relics.length<12){state.relics.unshift({...legacy,from:`第 ${state.generation} 世 · ${state.name}`});state.relics=state.relics.slice(0,12)}}log(`<b>${cause}</b>。神魂离体，所爱之人与洞府留在人间。`,'red');state.generation++;state.age=0;state.maxLife=100;state.naturalMaxLife=100;state.lifespanFactor=1;state.injuryYears=0;state.legacyLifeFloor=0;state.root={element:'木',grade:0,name:'凡品·木灵根'};state.minor=1;state.methods=['breath'];state.activeMethod='breath';state.children=[];state.realm=0;state.realmExp=0;state.spirit=0;state.stones=Math.min(65,18+Math.floor(state.familyProsperity/4));state.gear=[];state.equipped={weapon:null,armor:null,charm:null};state.partner=null;state.descendants=0;state.path=paths[Math.floor(rng()*paths.length)];state.origin=state.familyProsperity>2?'家族旁支·灵脉余泽':'异乡转世·一缕道痕';state.name=state.familyProsperity>3?['沈归尘','顾青崖','云照月','晏无咎'][Math.floor(rng()*4)]:'无名';state.paused=true;state.pending={kind:'rebirth',record:rec};save();render()}
function startRebirth(){
 const p=state.pending;if(!p||p.kind!=='potential')return;
 let remaining=state.daoMarks;
 for(const x of potentialTypes){const amount=Math.min(remaining,boundedInt(p.alloc?.[x.key],0,0,100000));state.potential[x.key]+=amount;remaining-=amount}
 state.daoMarks=remaining;
 Object.assign(state,P.newLifeFields(state.potential,rng));P.syncLife(state);
 state.pending=null;state.paused=false;
 log(`神魂转入人间，今世为「<b>${esc(state.name)}</b>」，生得 <b>${state.root.name}</b>。`,'gold');
 saveAndRender();toast(`第 ${state.generation} 世，修行开始。`);
}
function openPotential(){if(!state.pending||state.pending.kind!=='rebirth')return;state.pending={kind:'potential',alloc:{root:0,wisdom:0,fortune:0,vitality:0}};render()}
function upgradePotential(k,d){const p=state.pending;if(!p||p.kind!=='potential')return;const used=Object.values(p.alloc).reduce((a,b)=>a+b,0);if(d>0&&used<state.daoMarks)p.alloc[k]=(p.alloc[k]||0)+1;if(d<0&&p.alloc[k]>0)p.alloc[k]--;render()}
function equip(id){const item=state.gear.find(x=>x.id===id);if(!item)return;const old=state.equipped[item.slot];state.equipped[item.slot]=id;log(`你将「<b>${item.name}</b>」佩于身侧，灵蕴增加。`,'gold');if(old)toast(`已更换${item.slot==='weapon'?'兵刃':item.slot==='armor'?'衣甲':'灵饰'}。原法器收入纳戒。`);else toast(`已佩戴法宝「${item.name}」。`);saveAndRender()}
function recoverRelic(i){const relic=state.relics[i];if(!relic)return;if(state.gear.length>=20){toast('纳戒已满，先整理法宝。');return}state.relics.splice(i,1);const item={...relic,id:`g${Date.now().toString(36)}${Math.floor(rng()*1e4).toString(36)}`};state.gear.unshift(item);log(`循着家族旧忆寻回「<b>${item.name}</b>」，来自${item.from}。`,'gold');saveAndRender();toast(`找回传世灵器：${item.name}`)}
function action(name,el){switch(name){case'buy-pill':{const i=boundedInt(Number(el.dataset.grade),-1,0,5);if(i<0)return;const price=[18,45,110,270,680,1700][i],healing=[8,20,45,100,230,500][i];if(state.stones<price||state.injuryYears<=0)return;state.stones-=price;const restored=P.heal(state,healing);log(`购得 ${P.GRADES[i].name}回春丹，伤势恢复 <b>${restored}</b> 年。`,'gold');saveAndRender();toast(`恢复 ${restored} 年寿元。`);break}case'pause':state.paused=!state.paused;saveAndRender();break;case'speed':state.speed=Number(el.dataset.speed);saveAndRender();break;case'equip':equip(el.dataset.id);break;case'unequip':{const item=state.gear.find(x=>x.id===el.dataset.id);if(item){state.equipped[item.slot]=null;saveAndRender();toast('法宝已收入纳戒。')}break}case'toggle-buy':state.cave.autoBuy=!state.cave.autoBuy;saveAndRender();break;case'toggle-cultivate':state.cave.autoCultivate=!state.cave.autoCultivate;saveAndRender();break;case'upgrade-cave':{const cost=state.cave.level*45;if(state.stones<cost||state.cave.level>=10)return;state.stones-=cost;state.cave.level++;state.familyProsperity+=2;log(`你亲手扩建青崖洞府，灵脉升至第 <b>${state.cave.level}</b> 重。`,'gold');saveAndRender();toast('洞府灵脉拓展，修行更添助益。');break}case'resolve-pending':if(state.pending?.kind==='rebirth')openPotential();else if(state.pending?.kind==='partner'){state.activeTab='bond';render()}else if(state.pending?.kind==='merchant')render();break;case'potential-plus':upgradePotential(el.dataset.key,1);break;case'potential-minus':upgradePotential(el.dataset.key,-1);break;case'begin-rebirth':startRebirth();break;case'open-potential':openPotential();break;case'choose-partner':{const c=state.pending.candidates[Number(el.dataset.index)];if(!c)return;state.partner={...c,affinity:30};state.pending=null;state.paused=false;log(`你与 <b>${esc(c.name)}</b> 结为道侣，从此同修同游。`,'gold');saveAndRender();toast(`你与 ${c.name} 结下道侣之缘。`);break}case'decline-partner':state.pending=null;state.paused=false;log('你谢过相逢，独自沿着山径继续求道。');saveAndRender();break;case'decline-merchant':state.pending=null;state.paused=false;saveAndRender();break;case'buy-merchant':{const p=state.pending;if(!p||state.stones<p.price)return;state.stones-=p.price;state.gear.unshift(p.item);state.pending=null;state.paused=false;log(`以 ${p.price} 枚灵石购下「<b>${p.item.name}</b>」。法宝仍待亲自佩戴。`,'gold');saveAndRender();toast('灵器已收入纳戒。');break}case'recover-relic':recoverRelic(Number(el.dataset.index));break;case'reset':if(confirm('确定清除本机存档，从第一世重新开始吗？此操作无法撤回。')){localStorage.removeItem(SAVE_KEY);state=fresh();state.pending={kind:'potential',alloc:{root:0,wisdom:0,fortune:0,vitality:0}};state.paused=true;log('第一缕神魂即将转入人间。');saveAndRender()}break}}
function bind(){app.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav&&!nav.dataset.action){state.activeTab=nav.dataset.tab;saveAndRender();return}const btn=e.target.closest('[data-action]');if(btn){e.preventDefault();if(btn.dataset.action==='toggle-transfer'){const panel=document.getElementById('transfer-panel');if(panel)panel.hidden=!panel.hidden;return}if(btn.dataset.action==='export-save'){exportSave();return}if(btn.dataset.action==='import-save'){document.getElementById('save-file')?.click();return}action(btn.dataset.action,btn);return}const navb=e.target.closest('.nav-btn');if(navb){state.activeTab=navb.dataset.tab;saveAndRender()}});app.addEventListener('change',e=>{if(e.target?.id==='save-file'&&e.target.files?.[0]){importSaveFile(e.target.files[0]);e.target.value=''}})}
function init(){if(!state.generation)state=fresh();P.syncLife(state);if(state.generation===1&&state.age===0&&state.archive.length===0&&!state.pending){state.pending={kind:'potential',alloc:{root:0,wisdom:0,fortune:0,vitality:0}};state.paused=true}if(state.age>=state.maxLife&&!state.pending){state.paused=false;die('寿元已尽，寿终坐化')}if(!state.log.length)log('第一缕神魂入世，青溪村外，灵台初醒。');bind();render();interval=setInterval(tick,1000);setInterval(()=>{if(!state.paused&&!state.pending){save()}},10000);window.addEventListener('beforeunload',save)}
init();
})();

</script>
